<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TurfBooking</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'booking/css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">Turf<span>Booking</span></a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="{% url 'login' %}">Login</a>
        </div>
    </nav>

    <section class="turfs-section">
        <p class="section-label">JOIN US</p>
        <h2>Create <span>Your Account</span></h2>

        <form method="POST" class="turf-card"
              style="max-width: 450px; margin: 30px auto; padding: 30px;">
            {% csrf_token %}

            {% if form.errors %}
                <div class="error-message">
                    {{ form.errors }}
                </div>
            {% endif %}

            <label for="id_username">Username</label>
            {{ form.username }}

            <br><br>

            <label for="id_password1">Password</label>
            {{ form.password1 }}

            <br><br>

            <label for="id_password2">Confirm Password</label>
            {{ form.password2 }}

            <br><br>

            <button type="submit" class="primary-btn">
                Register
            </button>

            <p style="margin-top: 20px;">
                Already have an account?
                <a href="{% url 'login' %}">Login here</a>
            </p>
        </form>
    </section>

</body>
</html>
